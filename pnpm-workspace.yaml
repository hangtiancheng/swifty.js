packages:
  # Workspace package paths. Glob patterns are supported
  - packages/*

catalog:
  "@types/node": 24.13.3,
  "@lark.js/docs": '^0.0.19'
  "@lark.js/mvc": '^0.0.26'

overrides:
  "@types/node": "^24.13.3"
  "vite": "^7.3.6"
  "@lark.js/docs": '^0.0.19'
  "@lark.js/mvc": '^0.0.26'

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  core-js: true
  core-js-pure: true
  esbuild: true
  keytar: true
  msw: true
  protobufjs: true
  es5-ext: true

minimumReleaseAgeExclude:
  - '@swifty.js/docs@0.0.11'
  - '@lark.js/docs@0.0.16'
  - '@lark.js/mvc@0.0.26'
